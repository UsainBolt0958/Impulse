<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 280" width="330" height="280">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(165,140) scale(0.72) translate(-190,-35)" opacity="0.12" pointer-events="none">
    <path d="M 18 5 L 55 5 L 30 42 L 50 42 L 22 82 L 30 52 L 10 52 Z" fill="#812FEF"/>
    <path d="M 62 5 C 88 5 105 20 105 38 C 105 56 88 70 62 70 L 50 70 L 72 35 L 52 35 Z" fill="#812FEF"/>
    <line x1="122" y1="8" x2="122" y2="68" stroke="#888888" stroke-width="3.5" stroke-linecap="round"/>
    <text x="142" y="54" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="#111111">IMPULSE</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.8">
    <!-- Axis AB -->
    <line x1="255" y1="28" x2="255" y2="252" stroke-width="2"/>
    <polygon points="255,22 250,33 260,33" fill="#111" stroke="none"/>
    <polygon points="255,258 250,247 260,247" fill="#111" stroke="none"/>

    <!-- Rod -->
    <rect x="105" y="65" width="150" height="14" fill="#ffffff" stroke-width="1.8"/>
    <line x1="105" y1="72" x2="255" y2="72" stroke-dasharray="5,4" stroke-width="1.3"/>
    <!-- Dimension arrow for rod 3 m -->
    <line x1="108" y1="90" x2="160" y2="90" stroke-width="1.4"/>
    <line x1="198" y1="90" x2="252" y2="90" stroke-width="1.4"/>
    <polygon points="105,90 113,87 113,93" fill="#111" stroke="none"/>
    <polygon points="255,90 247,87 247,93" fill="#111" stroke="none"/>

    <!-- Sphere -->
    <circle cx="105" cy="175" r="34" fill="#ffffff" stroke-width="2"/>
    <line x1="105" y1="128" x2="105" y2="245" stroke-dasharray="4,4" stroke-width="1.4"/>
    <!-- Radius R line -->
    <line x1="105" y1="175" x2="124" y2="147" stroke-width="1.8"/>
    <circle cx="105" cy="175" r="2.5" fill="#111"/>
    <!-- Separation 3 m dashed line -->
    <line x1="105" y1="175" x2="255" y2="175" stroke-dasharray="5,4" stroke-width="1.6"/>
    <!-- Rotation arrow near bottom of sphere axis -->
    <path d="M 94 232 C 102 238 112 238 118 230" stroke-width="1.4"/>
    <polygon points="120,227 113,231 118,235" fill="#111" stroke="none"/>
  </g>
  <g font-family="Times New Roman, serif" font-size="19" fill="#111">
    <text x="263" y="40" font-style="italic">A</text>
    <text x="263" y="250" font-style="italic">B</text>
    <text x="165" y="95">3 <tspan font-style="italic">m</tspan></text>
    <text x="145" y="116"><tspan font-style="italic">M</tspan> = 40 <tspan font-style="italic">kg</tspan></text>
    <text x="120" y="168" font-style="italic">R</text>
    <text x="140" y="196">3 <tspan font-style="italic">m</tspan></text>
  </g>
</svg>