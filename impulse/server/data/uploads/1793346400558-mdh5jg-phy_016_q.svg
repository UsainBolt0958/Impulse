<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" width="360" height="225">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(180,112) scale(0.78) translate(-190,-35)" opacity="0.12" pointer-events="none">
    <path d="M 18 5 L 55 5 L 30 42 L 50 42 L 22 82 L 30 52 L 10 52 Z" fill="#812FEF"/>
    <path d="M 62 5 C 88 5 105 20 105 38 C 105 56 88 70 62 70 L 50 70 L 72 35 L 52 35 Z" fill="#812FEF"/>
    <line x1="122" y1="8" x2="122" y2="68" stroke="#888888" stroke-width="3.5" stroke-linecap="round"/>
    <text x="142" y="54" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="#111111">IMPULSE</text>
  </g>
  <defs>
    <pattern id="paintHatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.8"/>
    </pattern>
  </defs>
  <g>
    <!-- Equilateral prism -->
    <polygon points="180,28 106,156 254,156" fill="none" stroke="#111" stroke-width="2.2"/>
    <!-- Painted layer at bottom -->
    <rect x="106" y="156" width="148" height="14" fill="url(#paintHatch)" stroke="#111" stroke-width="2"/>
    <!-- Incident light ray perpendicular to left face -->
    <line x1="72" y1="77" x2="218" y2="156" stroke="#111" stroke-width="2"/>
    <!-- Arrowhead on incoming ray -->
    <polygon points="108,96.5 96,84 91,93" fill="#111"/>
    <!-- Pointer arrow for paint(n2) -->
    <polyline points="208,195 186,195 186,174" fill="none" stroke="#111" stroke-width="1.8"/>
    <polygon points="186,171 181,180 191,180" fill="#111"/>
    <text x="213" y="201" font-family="Times New Roman, serif" font-size="22" fill="#111">paint(<tspan font-style="italic">n</tspan><tspan dy="5" font-size="15">2</tspan><tspan dy="-5">)</tspan></text>
  </g>
</svg>