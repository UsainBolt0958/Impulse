    <!-- Capacitor C -->
    <line x1="165" y1="38" x2="165" y2="72" stroke-width="2.2"/>
    <line x1="176" y1="38" x2="176" y2="72" stroke-width="2.2"/>
    <line x1="176" y1="55" x2="215" y2="55"/>
    <!-- Resistor R -->
    <polyline points="215,55 220,45 228,65 236,45 244,65 252,45 260,65 265,55"/>
    <line x1="265" y1="55" x2="365" y2="55"/>

    <!-- Left outer branch: switch S1 -->
    <line x1="65" y1="55" x2="65" y2="105"/>
    <line x1="65" y1="105" x2="82" y2="128"/>
    <path d="M 78 112 C 88 116 88 128 76 132" stroke-width="1.3"/>
    <line x1="65" y1="138" x2="65" y2="205"/>

    <!-- Left inner branch: inductor L2 -->
    <line x1="135" y1="55" x2="135" y2="102"/>
    <path d="M 135 102 C 120 102 120 118 135 118 C 142 118 142 112 135 112 C 120 112 120 130 135 130 C 142 130 142 124 135 124 C 120 124 120 142 135 142 C 142 142 142 136 135 136 C 120 136 120 154 135 154 C 142 154 142 148 135 148 C 120 148 120 166 135 166"/>
    <line x1="135" y1="166" x2="135" y2="205"/>

    <!-- Right inner branch: switch S2 -->
    <line x1="295" y1="55" x2="295" y2="105"/>
    <line x1="295" y1="105" x2="312" y2="128"/>
    <path d="M 308 112 C 318 116 318 128 306 132" stroke-width="1.3"/>
    <line x1="295" y1="138" x2="295" y2="205"/>

    <!-- Right outer branch: inductor L1 -->
    <line x1="365" y1="55" x2="365" y2="102"/>
    <path d="M 365 102 C 350 102 350 118 365 118 C 372 118 372 112 365 112 C 350 112 350 130 365 130 C 372 130 372 124 365 124 C 350 124 350 142 365 142 C 372 142 372 136 365 136 C 350 136 350 154 365 154 C 372 154 372 148 365 148 C 350 148 350 166 365 166"/>
    <line x1="365" y1="166" x2="365" y2="205"/>

    <!-- Bottom branch with AC source -->
    <line x1="65" y1="205" x2="194" y2="205"/>
    <circle cx="210" cy="205" r="16" fill="#ffffff"/>
    <path d="M 201 205 Q 205.5 197 210 205 T 219 205" stroke-width="1.6"/>
    <line x1="226" y1="205" x2="365" y2="205"/>
  </g>
  <!-- Labels -->
  <g font-family="Times New Roman, serif" font-size="18" fill="#111">
    <text x="128" y="30"><tspan font-style="italic">C</tspan> = 100&#956;F</text>
    <text x="235" y="30" font-style="italic">R</text>
    <text x="36" y="125"><tspan font-style="italic">S</tspan><tspan dy="4" font-size="13">1</tspan></text>
    <text x="148" y="142"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="13">2</tspan></text>
    <text x="268" y="125"><tspan font-style="italic">S</tspan><tspan dy="4" font-size="13">2</tspan></text>
    <text x="380" y="142"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="13">1</tspan></text>
    <text x="228" y="232"><tspan font-style="italic">v</tspan> = <tspan font-style="italic">V</tspan><tspan dy="4" font-size="13">0</tspan><tspan dy="-4" font-style="italic"> sin</tspan> (300<tspan font-style="italic">t</tspan>)</text>
  </g>
</svg>